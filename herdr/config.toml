onboarding = false

[theme]
name = "one-dark"
auto_switch = false

[ui]
sidebar_collapsed_mode = "hidden"

[keys]
toggle_sidebar = "prefix+b"
detach = "prefix+d"
# Keep the resize-mode entry point and provide reliable prefixed one-shot keys.
resize_mode = "prefix+r"
# Resize directly with a prefix, without relying on resize-mode local keys.
resize_pane_left = "prefix+shift+h"
resize_pane_down = "prefix+shift+j"
resize_pane_up = "prefix+shift+k"
resize_pane_right = "prefix+shift+l"

# Workspace navigation: use the picker for discovery, arrows for adjacent
# workspaces, and Shift+1..9 for direct access.
workspace_picker = "prefix+w"
goto = "prefix+g"
previous_workspace = "prefix+shift+up"
next_workspace = "prefix+shift+down"
switch_workspace = "prefix+shift+1..9"
new_workspace = "prefix+shift+n"
rename_workspace = "prefix+shift+w"
close_workspace = "prefix+shift+d"

# Agent navigation: cycle agents vertically, or jump directly to agent slots
# 1..9. Keeping the number row separate avoids collisions with workspaces.
previous_agent = "prefix+alt+up"
next_agent = "prefix+alt+down"
focus_agent = "prefix+alt+1..9"

# Keep the same Ctrl+h/j/k/l chords in Neovim and Herdr. The smart-splits.nvim
# plugin forwards them to Neovim when it owns the current split, and crosses
# the Herdr pane boundary when Neovim is at an edge.
[[keys.command]]
key = "ctrl+h"
type = "plugin_action"
command = "smart-splits.nvim.left"
description = "navigate left (vim/herdr)"

[[keys.command]]
key = "ctrl+j"
type = "plugin_action"
command = "smart-splits.nvim.down"
description = "navigate down (vim/herdr)"

[[keys.command]]
key = "ctrl+k"
type = "plugin_action"
command = "smart-splits.nvim.up"
description = "navigate up (vim/herdr)"

[[keys.command]]
key = "ctrl+l"
type = "plugin_action"
command = "smart-splits.nvim.right"
description = "navigate right (vim/herdr)"
